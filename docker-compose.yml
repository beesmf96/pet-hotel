services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID}"
        GID: "${GID}"
    container_name: pet_hotel_app
    restart: unless-stopped
    user: "${UID}:${GID}"
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - pet_hotel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: pet_hotel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pet_hotel
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: pet_hotel_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pet_hotel}
      POSTGRES_USER: ${DB_USERNAME:-pet_hotel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pet_hotel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pet_hotel} -d ${DB_DATABASE:-pet_hotel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pet_hotel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pet_hotel

  node:
    image: oven/bun:alpine
    container_name: pet_hotel_node
    user: "${UID}:${GID}"
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - pet_hotel
    command: sh -c "bun install && bun run dev"
    ports:
      - "5173:5173"
    profiles:
      - dev

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID}"
        GID: "${GID}"
    container_name: pet_hotel_queue
    restart: unless-stopped
    user: "${UID}:${GID}"
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - pet_hotel
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - app
      - redis

volumes:
  postgres_data:
  redis_data:

networks:
  pet_hotel:
    driver: bridge
